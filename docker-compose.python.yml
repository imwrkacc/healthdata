# Docker Compose for Python-based Apple Health Exporter
# Use this if you don't have macOS and want to use the Python exporter

version: '3.8'

services:
  health-exporter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apple-health-exporter
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      # Mount your Apple Health export file here
      # Update the path to point to your export.zip or export.xml
      - ./export.zip:/data/export.zip:ro
      # OR if you extracted the zip:
      # - ./apple_health_export/export.xml:/data/export.xml:ro
    command: ["--file", "/data/export.zip", "--host", "0.0.0.0", "--port", "9090"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9090/health')"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - health-monitoring

  prometheus:
    image: prom/prometheus:latest
    container_name: health-prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=90d'
    networks:
      - health-monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: health-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=health123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - health-monitoring

volumes:
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  health-monitoring:
    driver: bridge
