# Docker Compose configuration for Prometheus + Grafana
# This provides a complete monitoring stack to visualize your HealthKit metrics

version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: healthkit-prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"  # Using 9091 to avoid conflict with iPhone's 9090
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=90d'  # Keep 90 days of data
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - healthkit-monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: healthkit-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=healthkit  # Change this!
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - healthkit-monitoring

volumes:
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  healthkit-monitoring:
    driver: bridge
